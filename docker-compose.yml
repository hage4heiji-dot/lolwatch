# 実行例: docker compose --env-file .env up -d
# postgresとnginxは saitama-council-watch 側の docker_default ネットワーク上の
# 既存コンテナを共有利用する(このcomposeファイルではpostgres/nginxを持たない)。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lolwatch-app:latest
    container_name: lolwatch-app
    env_file:
      - .env
    volumes:
      # 記事投稿画像の保存先。イメージはCOPY . .でビルド時に固定されるため、
      # 再ビルド・コンテナ再作成を跨いで投稿済み画像が消えないようVolumeに永続化する。
      - article-uploads:/app/public/uploads
    restart: unless-stopped
    logging: *default-logging

  worker:
    # post-daily-site-stats.tsは起動直後には実行せず、毎日 00:05 UTC(=09:05 JST)まで
    # 待ってから実行する(再デプロイのたびに日次レポートが二重投稿されないようにするため)。
    image: lolwatch-app:latest
    container_name: lolwatch-worker
    env_file:
      - .env
    command:
      [
        "sh",
        "-c",
        "(while true; do npx tsx scripts/check-rank-activity.ts; sleep 21600; done) & (while true; do npx tsx scripts/post-daily-violations.ts; sleep 86400; done) & (while true; do npx tsx scripts/sync-article-pageviews.ts; sleep 21600; done) & (while true; do sleep $$(( 86400 - $$(date +%s) % 86400 + 300 )); npx tsx scripts/post-daily-site-stats.ts; done) & wait",
      ]
    depends_on:
      - app
    restart: unless-stopped
    logging: *default-logging

volumes:
  article-uploads:

networks:
  default:
    name: docker_default
    external: true
