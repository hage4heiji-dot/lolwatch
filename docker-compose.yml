# 実行例: docker compose --env-file .env up -d
# postgresとnginxは saitama-council-watch 側の docker_default ネットワーク上の
# 既存コンテナを共有利用する(このcomposeファイルではpostgres/nginxを持たない)。
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lolwatch-app:latest
    container_name: lolwatch-app
    env_file:
      - .env
    restart: unless-stopped

  worker:
    image: lolwatch-app:latest
    container_name: lolwatch-worker
    env_file:
      - .env
    command: ["sh", "-c", "while true; do npx tsx scripts/check-rank-activity.ts; sleep 21600; done"]
    depends_on:
      - app
    restart: unless-stopped

networks:
  default:
    name: docker_default
    external: true
